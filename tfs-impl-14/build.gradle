import com.thoughtworks.go.build.DownloadFile
import com.thoughtworks.go.build.TextUtils
import com.thoughtworks.go.build.VerifyJarTask

plugins {
  id 'maven-publish' // the repackaged TFS SDK is published to mavenLocal
}

description = 'GoCD TFS SDK wrapper v14'

def tfsSdkGroupId = 'com.microsoft.tfs'
def tfsSdkModuleId = 'com.microsoft.tfs.sdk'
def tfsSdkVersion = "${rootProject.versions.tfsSdk}-trimmed"

jar {
  archiveClassifier = 'classes'
}

repositories {
  mavenCentral { content { excludeGroup tfsSdkGroupId } }
  mavenLocal { content { includeGroup tfsSdkGroupId } }
}

def destFile(String url) {
  new File(gradle.gradleUserHomeDir, "download-cache/${TextUtils.md5Hex(url)}/${new File(URI.create(url).toURL().path).name}")
}

def downloadTfsSdk = tasks.register('downloadTfsSdk', DownloadFile) {
  def srcUrl = "https://github.com/microsoft/team-explorer-everywhere/releases/download/${rootProject.versions.tfsSdk}/TFS-SDK-${rootProject.versions.tfsSdk}.zip"
  src srcUrl
  dest destFile(srcUrl)
  checksum = rootProject.versions.tfsSdkSha256sum
}

def downloadTfsSdkSource = tasks.register('downloadTfsSdkSource', DownloadFile) {
  def srcUrl = "https://github.com/microsoft/team-explorer-everywhere/archive/refs/tags/${rootProject.versions.tfsSdk}.tar.gz"
  src srcUrl
  dest destFile(srcUrl)
  // No checksum: GitHub generates tag archives on demand and does not guarantee their bytes stay stable over
  // time, so a pinned checksum would break spuriously. The SDK binary itself remains checksum-verified above.
}

def extractTfsSdk = tasks.register('extractTfsSdk', Copy) {
  def sdkTarget = layout.buildDirectory.dir("tfssdk")
  outputs.dir(sdkTarget)
  doFirst {
    delete sdkTarget
  }

  from(zipTree(downloadTfsSdk.map { it.dest })) {
    include "*/redist/**"
    eachFile { FileCopyDetails fcd ->
      fcd.relativePath = new RelativePath(true, fcd.relativePath.segments.drop(2))
    }
    includeEmptyDirs = false
  }
  into sdkTarget
}

// Builds a -sources jar from the SDK's source release, flattening each Eclipse project's src/ folder to the
// package root so paths mirror the classes in the SDK jar.
def tfsSdkSourcesJar = tasks.register('tfsSdkSourcesJar', Jar) {
  archiveBaseName = tfsSdkModuleId
  archiveVersion = tfsSdkVersion
  archiveClassifier = 'sources'
  preserveFileTimestamps = true

  from(tarTree(downloadTfsSdkSource.map { it.dest })) {
    include '*/source/*/src/**'
    eachFile { FileCopyDetails fcd ->
      fcd.relativePath = new RelativePath(true, fcd.relativePath.segments.drop(4))
    }
    includeEmptyDirs = false
  }
}

// Content excluded when repackaging the TFS SDK jar: features GoCD does not use. GoCD only uses the SDK's
// version control client (checkout/get), so the web-service proxies and client APIs for other TFS features
// can be removed. The JVM resolves classes lazily, so the remaining references to these (e.g. lazy accessors
// such as TFSTeamProjectCollection.getBuildServer()) are only a problem if actually called.
// Note that ms/ws (identity) and ms/tfs/services (location/registration) proxies must be retained: they
// are used by the framework/connection machinery of every TFS connection. TfsSDKJarTrimTest verifies that
// every class remaining in the trimmed jar is still loadable.

def trimTfsSdkJar = tasks.register('trimTfsSdkJar', Jar) {
  archiveBaseName = tfsSdkModuleId
  archiveVersion = tfsSdkVersion
  preserveFileTimestamps = true

  from(zipTree(extractTfsSdk.map { new File(it.destinationDir, "lib/${tfsSdkModuleId}-${rootProject.versions.tfsSdk}.jar") }))


  // Remove feature clients GoCD never uses. GoCD supplies its own minimal client/web service factories
  // (see GoTfsConnectionAdvisor) so these are never resolved. Retained despite being unused, because the
  // ClientFactory/WebServiceFactory interfaces and TFSConnection.getClient() reference a few individual
  // classes from these features in method signatures or always-executed class literals, so those classes
  // must remain resolvable: empty stand-ins (WSSClient, ProjectInfo, _ListsSoap, _IntegrationServiceSoap)
  // are provided in this module's own sources.
  exclude 'com/microsoft/tfs/core/clients/authorization/**'
  exclude 'com/microsoft/tfs/core/clients/build/**'
  exclude 'com/microsoft/tfs/core/clients/commonstructure/**'
  exclude 'com/microsoft/tfs/core/clients/favorites/**'
  exclude 'com/microsoft/tfs/core/clients/framework/catalog/**'
  exclude 'com/microsoft/tfs/core/clients/framework/configuration/**'
  exclude 'com/microsoft/tfs/core/clients/groupsecurity/**'
  exclude 'com/microsoft/tfs/core/clients/linking/**'
  exclude 'com/microsoft/tfs/core/clients/reporting/**'
  exclude 'com/microsoft/tfs/core/clients/serverstatus/**'
  exclude 'com/microsoft/tfs/core/clients/sharepoint/**'
  exclude 'com/microsoft/tfs/core/clients/team/**'
  exclude 'com/microsoft/tfs/core/clients/teamsettings/**'
  exclude 'com/microsoft/tfs/core/clients/teamstore/**'

  // The SDK's default factories, bypassed by the Minimal* factories supplied via MinimalTfsConnectionAdvisor:
  // their initialization eagerly resolves class literals for every SDK feature, most of which are trimmed away
  exclude 'com/microsoft/tfs/core/config/client/DefaultClientFactory*'
  exclude 'com/microsoft/tfs/core/config/webservice/DefaultWebServiceFactory*'

  // Remove service proxies for unused features
  exclude 'ms/tfs/build/**'  // TFS build service proxies
  exclude 'ms/tfs/workitemtracking/**'  // work item tracking service proxies
  exclude 'ms/tfs/services/admin/**'
  exclude 'ms/tfs/services/authorization/**'
  exclude 'ms/tfs/services/classification/**'
  exclude 'ms/tfs/services/linking/**'
  exclude 'ms/tfs/services/teamconfiguration/**'
  exclude 'ms/tfs/services/groupsecurity/**'
  exclude 'ms/tfs/services/serverstatus/**'
  exclude 'ms/tfs/versioncontrol/admin/**'  // version control admin service, only referenced by the excluded DefaultWebServiceFactory
  exclude 'ms/sql/**'  // SQL Server Reporting Services proxies
  exclude 'ms/wss/**'  // SharePoint service proxies
  exclude 'ms/ws/_CatalogWebService*'  // catalog/identity services are not registered by MinimalTfsWebServiceFactory
  exclude 'ms/ws/_IdentityManagementWebService*'
  exclude 'com/microsoft/alm/**'  // partial leftovers of ALM REST/secret libraries that were never fully bundled
  exclude 'com/microsoft/tfs/console/**'  // command-line client console helpers, referenced by nothing else in the SDK
  exclude 'templates/**'  // release notes template, referenced by nothing in the SDK

  // Embedded third-party libraries with no remaining references after the removals above (they supported
  // the removed ALM REST client and feature clients).
  exclude 'com/fasterxml/**'  // jackson
  exclude 'com/google/**'  // guava
  exclude 'eu/infomas/**'  // annotation-detector
  exclude 'javax/annotation/**'  // JSR-305 annotations (class-retention; not used at runtime)
  exclude 'org/apache/commons/io/**'
  exclude 'org/apache/commons/lang3/**'
  exclude 'org/apache/http/**'  // httpclient 4.x (the SDK's SOAP stack uses its own fork)
  exclude 'META-INF/services/com.fasterxml*'
  exclude 'META-INF/services/javax.annotation.processing.Processor'

  // Remove DB, as GoCD only ever creates SERVER workspaces, never hsqldb-backed local ones
  exclude 'com/microsoft/tfs/core/internal/db/**'
  exclude 'org/hsqldb/**'
  exclude 'hsqlServlet.class'  // hsqldb's own top-level launcher class
  exclude 'db.properties'

  // Remove misleading loading code / config
  // GoCD routes all SDK logging to slf4j via the commons-logging API, provided via jcl-over-slf4j from the parent classpath
  exclude 'org/apache/commons/logging/**', 'commons-logging.properties'
  exclude 'com/microsoft/tfs/logging/**'
  exclude 'org/apache/logging/log4j/**', 'META-INF/org/apache/logging/**', 'META-INF/log4j-provider.properties'
  exclude 'log4j2.xml', 'Log4j-*'

  // Unloadable even in the original SDK jar: compiled against Eclipse OSGi NLS, which was never bundled
  exclude 'com/microsoft/tfs/core/clients/webservices/Messages.class'
}

publishing {
  publications.register('tfsSdk', MavenPublication) {
    groupId = tfsSdkGroupId
    artifactId = tfsSdkModuleId
    version = tfsSdkVersion
    artifact trimTfsSdkJar
    artifact tfsSdkSourcesJar
    pom {
      url = 'https://github.com/Microsoft/team-explorer-everywhere'
      licenses {
        license {
          name = 'MIT'
          url = 'https://spdx.org/licenses/MIT.html'
        }
      }
    }
  }
}

def publishTfsSdkPublicationToMavenLocal = tasks.named('publishTfsSdkPublicationToMavenLocal') {
  // Publish tasks declare no inputs/outputs and so re-publish on every build. Declaring them makes the
  // task incremental; the target directory within the local repository is exclusively this publication's.
  inputs.files(trimTfsSdkJar, tfsSdkSourcesJar, tasks.named('generatePomFileForTfsSdkPublication'))
  outputs.dir(new File(new File(repositories.named('MavenLocal', MavenArtifactRepository).get().url), "${tfsSdkGroupId.replace('.', '/')}/${tfsSdkModuleId}"))
}

generateLicenseReport.dependsOn(publishTfsSdkPublicationToMavenLocal)

tasks.withType(JavaCompile).configureEach {
  dependsOn publishTfsSdkPublicationToMavenLocal // makes the module dependency below resolvable from mavenLocal
}

dependencies {
  implementation project(':base')
  implementation project(':common')
  implementation project(':domain')
  implementation "${tfsSdkGroupId}:${tfsSdkModuleId}:${tfsSdkVersion}" // from the project-local repository declared above
  compileOnly rootProject.deps.jetBrainsAnnotations

  testImplementation rootProject.deps.junit5Api
  testRuntimeOnly rootProject.deps.junit5Engine
  testRuntimeOnly rootProject.deps.junit5PlatformLauncher
  testImplementation rootProject.deps.mockitoCore
  testImplementation rootProject.deps.assertJ
  testRuntimeOnly rootProject.deps.slf4jJcl
}

def fatJar = tasks.register('fatJar', Jar) {
  finalizedBy 'verifyJar'

  // Excludes platforms agents cannot run on: those without Java 21+ runtimes, and all 32-bit architectures
  // (GoCD does not support 32-bit; for AIX the libraries are 32-bit-only). The SDK's NativeLoader resolves
  // libraries only within the <os>/<arch> directory for the current platform, so other platforms are unaffected.
  from(jar.archiveFile) { into('lib/') }

  from(trimTfsSdkJar) {
    into 'lib/'
  }
  from(extractTfsSdk.map { new File(it.destinationDir, 'native') }) {
    into 'tfssdk/native'
    exclude 'aix/**'
    exclude 'hpux/**'
    exclude 'solaris/**'
    exclude 'freebsd/x86/**'
    exclude 'linux/arm/**'
    exclude 'linux/ppc/**'
    exclude 'linux/x86/**'
    exclude 'win32/x86/**'
  }
}

tasks.register('verifyJar', VerifyJarTask) {
  jarTask = fatJar
  expectedJars = [
    "lib": [
      "${project.name}-${project.version}-classes.jar",
      "${tfsSdkModuleId}-${tfsSdkVersion}.jar",
    ]
  ]
}

artifacts {
  fatJarConfig fatJar
}
