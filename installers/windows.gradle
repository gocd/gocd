import com.thoughtworks.go.build.*
import org.apache.tools.ant.filters.FixCrLfFilter

def destFile(String url) {
  new File(gradle.gradleUserHomeDir, "download-cache/${TextUtils.md5Hex(url)}/${new File(URI.create(url).toURL().path).name}")
}

// A single installer bundles a JRE for each architecture, selecting the native one at install time
static List<Architecture> windowsJreArchitectures() {
  [Architecture.x64, Architecture.aarch64]
}

TaskProvider<DownloadFile> windowsJreDownloadTask(Architecture arch) {
  tasks.named("downloadWindowsJre${arch.name().capitalize()}", DownloadFile) as TaskProvider<DownloadFile>
}

windowsJreArchitectures().each { Architecture arch ->
  def javaVersion = (rootProject.goVersions as GoVersions).packagedJavaVersion

  def checksumTask = tasks.register("downloadWindowsJreChecksum${arch.name().capitalize()}", DownloadFile) {
    src javaVersion.toSha256SumURLFor(OperatingSystem.windows, arch)
    dest destFile(src.toString())
  }

  tasks.register("downloadWindowsJre${arch.name().capitalize()}", DownloadFile) {
    dependsOn checksumTask
    src javaVersion.toDownloadURLFor(OperatingSystem.windows, arch)
    dest destFile(src.toString())
    checksum = { checksumTask.get().outputs.files.singleFile.getText("utf-8").trim().split(" ").first() }
  }
}

def configureWindowsFilesystem(Task windowsInstallerTask, InstallerType installerType, Zip genericZipTask, File buildRoot) {
  windowsInstallerTask.with {
    group = project.name
    description = "Build the ${installerType.baseName} windows (exe) installer"

    dependsOn windowsJreArchitectures().collect { windowsJreDownloadTask(it) }
    dependsOn genericZipTask

    def goVersions = rootProject.goVersions as GoVersions
    inputs.property('goVersions', goVersions)

    def installerBaseDirName = "${installerType.baseName}-${goVersions.goVersion}"
    Map<Architecture, Provider<File>> jreZips = windowsJreArchitectures().collectEntries { Architecture arch ->
      [(arch): windowsJreDownloadTask(arch).map { it.outputs.files.singleFile }]
    }

    def injected = project.objects.newInstance(Injected)
    doFirst {
      injected.fileOps.delete { delete(buildRoot) }
      new File("${layout.buildDirectory.get()}/distributions/win").mkdirs()

      injected.fileOps.copy {
        into buildRoot

        def genericZipTree = zipTree(genericZipTask.archiveFile)
        // dont include the wrapper.conf, and tanuki wrappers for OSes other than windows
        from(genericZipTree) {
          exclude "${installerBaseDirName}/wrapper-config/wrapper.conf"
          exclude "${installerBaseDirName}/wrapper/wrapper-*"
          exclude "${installerBaseDirName}/wrapper/libwrapper-*"
          exclude "${installerBaseDirName}/bin/*"
        }

        from(genericZipTree) {
          include "${installerBaseDirName}/wrapper/*.dll"
          include "${installerBaseDirName}/wrapper/*.exe"
          include "${installerBaseDirName}/bin/*.bat"
        }

        from("include/wrapper-properties.${installerType.baseName}.conf.example") {
          into "${installerBaseDirName}/wrapper-config"
          rename ".*", "wrapper-properties.conf.example"
        }

        // include the wrapper.conf, but replace the java command
        from(genericZipTree) {
          include "${installerBaseDirName}/wrapper-config/wrapper.conf"
          filter { String eachLine ->
            if (eachLine == 'wrapper.java.command=java') {
              eachLine = 'wrapper.java.command=jre/bin/java'
            }
            eachLine
          }

          filter { String eachLine ->
            eachLine = eachLine.replace("=${installerType.baseName}".toString(), "=${installerType.windowsAndOSXServiceName}".toString())
            return eachLine
          }

          filter(FixCrLfFilter.class, eol: FixCrLfFilter.CrLf.newInstance("dos"))
        }

        jreZips.each { Architecture arch, Provider<File> jreZip ->
          from(zipTree(jreZip.get())) {
            eachFile { FileCopyDetails fcd ->
              List<String> segments = fcd.relativePath.segments
              segments.set(1, "jre")
              fcd.relativePath = new RelativePath(!fcd.isDirectory(), (segments as String[]))
            }
            includeEmptyDirs = false
            // relative to parent copy task's `into`
            into new File(buildRoot, "jre-${arch.canonicalName}").name
          }
        }
      }
    }
  }
}

def configureNSIS(Task packageTask, InstallerType installerType, File buildRoot, File destDir) {
  packageTask.with {
    def goVersions = rootProject.goVersions as GoVersions
    def outputFile = project.file("${destDir.path}/${installerType.baseName}-${goVersions.fullVersion}-jre-64bit-setup.exe")
    outputs.file(outputFile)

    // pad enough zeros to be able to convert the version string using simple numbers, instead of version numbers
    def registryVersionString = "${goVersions.goVersion.split(/\./).collect { it.padLeft(2, '0') }.join()}${goVersions.distVersion.padLeft(5, '0')}"

    def installerContents = project.file("${buildRoot.path}/${installerType.baseName}-${goVersions.goVersion}")
    def unInstallManifestFile = project.file("${buildRoot.path}/uninstall-manifest.nsi")
    def targetArch = "x86-unicode"
    def nsisPluginsDir = project.file("windows/nsis-plugins-${targetArch}")
    def icon = project.file('windows/gocd.ico')
    def nsiPath = project.file("windows/${installerType.baseName}.nsi").path
    def licenseSourceFile = rootProject.file("LICENSE")

    inputs.dir('windows')

    def injected = project.objects.newInstance(Injected)

    // We only have a custom NSIS build with logging enabled for Linux on CI
    // See https://github.com/gocd/nsis-rpm/blob/master/mingw-nsis.spec#L2
    def usingCustomNsisBinaryWithLogging = OperatingSystemHelper.CURRENT_OS.isLinux()

    doLast {
      destDir.mkdirs()

      unInstallManifestFile.withWriter { out ->
        injected.objectFactory.fileTree().from(installerContents).forEach { File eachFile ->
          out.println("Delete \"\$INSTDIR\\${installerContents.relativePath(eachFile).replace('/', '\\')}\"")
        }
      }

      List<String> cmdArgs = [
        "-DTARGET_ARCH=${targetArch}",
        "-DADDITIONAL_PLUGINS_DIR=${nsisPluginsDir}",
        "-DCOMPONENT_FULL_VERSION=${goVersions.fullVersion}",
        "-DCOMPONENT_NAME=${installerType.baseName.replace("go-", "").capitalize()}",
        "-DCOMPONENT_REGISTRY_VERSION=${registryVersionString}",
        "-DCOMPONENT_VERSION=${goVersions.goVersion}",
        "-DCUSTOM_PAGES=${installerType.baseName}-custom-page.nsi",
        "-DGOCD_ICON=${icon}",
        "-DGOCD_LICENSE_FILE=${licenseSourceFile}",
        "-DINSTALLER_CONTENTS=${installerContents.path}",
        "-DJRE_AARCH64_DIR=${new File(buildRoot, "jre-${Architecture.aarch64.canonicalName}").path}",
        "-DJRE_X64_DIR=${new File(buildRoot, "jre-${Architecture.x64.canonicalName}").path}",
        "-DOUTPUT_FILE=${outputFile.path}",
        "-DUNINSTALL_MANIFEST_FILE=${unInstallManifestFile.path}",
        "-DWINDOWS_PRODUCT_VERSION=${goVersions.goVersion}.${goVersions.distVersion}",
      ]

      if (usingCustomNsisBinaryWithLogging) {
        cmdArgs += ["-DLOGGING_ENABLED=true"]
      }

      cmdArgs += ["-V4"] // verbose

      injected.execOps.exec { ExecSpec execSpec ->
        commandLine = (["makensis"] + cmdArgs + [nsiPath])

        println "[${execSpec.workingDir}]\$ ${execSpec.executable} ${execSpec.args.join(' ')}"
      }
    }
  }
}

def agentWindowsInstaller = tasks.register('agentWindowsInstaller') { thisTask ->
  def installerType = InstallerTypeAgent.instance
  def buildRoot = project.file("${layout.buildDirectory.get()}/${installerType.baseName}/win/BUILD_ROOT")
  def destDir = project.file("${layout.buildDirectory.get()}/distributions/win")

  configureWindowsFilesystem(thisTask, installerType, agentGenericZip, buildRoot)
  configureNSIS(thisTask, installerType, buildRoot, destDir)

  finalizedBy "${thisTask.name}Metadata"
}

def serverWindowsInstaller = tasks.register('serverWindowsInstaller') { thisTask ->
  def installerType = InstallerTypeServer.instance
  def buildRoot = project.file("${layout.buildDirectory.get()}/${installerType.baseName}/win/BUILD_ROOT")
  def destDir = project.file("${layout.buildDirectory.get()}/distributions/win")

  configureWindowsFilesystem(thisTask, installerType, serverGenericZip, buildRoot)
  configureNSIS(thisTask, installerType, buildRoot, destDir)

  finalizedBy "${thisTask.name}Metadata"
}

[InstallerTypeAgent.instance, InstallerTypeServer.instance].each { installerType ->
  def packageTaskName = "${installerType.name}WindowsInstaller"
  tasks.register("${packageTaskName}Metadata", InstallerMetadataTask) {
    // Installer supports all (64-bit) architectures
    architecture = Architecture.all
    packagedJavaVersion = (rootProject.goVersions as GoVersions).packagedJavaVersion
    packageTask = project.tasks.named(packageTaskName)
    type = installerType
  }
}

assemble.dependsOn(agentWindowsInstaller, serverWindowsInstaller)
